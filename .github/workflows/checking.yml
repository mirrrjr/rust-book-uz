name: Link check

on:
  schedule:
    - cron: "0 0 * * SAT"
  workflow_dispatch:

permissions: write-all

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          # Note: This changes the lychee output directory as well.
          workingDirectory: rustbook-uz/src
          # Resolve relative links (../std/..., ../reference/..., chXX-YY.html, ...)
          # against the site they are written for, instead of the local checkout.
          # Exclude the localhost demo URLs (ch21-02) and mdbook source-form
          # links (*.md) that mdbook rewrites to .html when building.
          args: >-
            --base-url https://doc.rust-lang.org/stable/book/
            --exclude '^http://127\.0\.0\.1'
            --exclude '^https://doc\.rust-lang\.org/stable/book/.*\.md'

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./rustbook-uz/src/lychee/out.md
          labels: report, automated issue
